<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aikido Vokabel-Dojo · 6. Kyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dojo">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0f1113; --surface:#181b20; --surface2:#1f242b; --line:#262b32;
  --text:#e9e4d7; --muted:#84817a; --accent:#9bb4d4; --good:#73b08a; --bad:#cf8268;
  --font:'Inclusive Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}
.app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;}
.brand{font-size:.95rem;font-weight:600;letter-spacing:.02em;color:var(--text);}
.menubtn{background:none;border:none;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 10px;border-radius:8px;}
.app.menuopen .menubtn{color:var(--accent);}
.panel{flex:none;display:none;padding:2px 16px 12px;border-bottom:1px solid var(--line);}
.app.menuopen .panel{display:block;}
.stats{display:flex;gap:10px;margin:6px 0 14px;}
.stat{flex:1;text-align:center;}
.stat .num{font-size:1.3rem;font-weight:600;color:var(--text);line-height:1;}
.stat .lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px;}
.stat.streak .num{color:var(--accent);}
.masterbar{flex:none;height:3px;margin:2px 18px 0;background:var(--surface2);border-radius:99px;overflow:hidden;}
.masterbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1);}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px;}
.chip{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.84rem;font-weight:500;padding:3px 0;cursor:pointer;border-bottom:2px solid transparent;}
.chip.active{color:var(--text);border-bottom-color:var(--accent);}
main#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 18px;display:flex;flex-direction:column;}
nav.tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 8px max(9px, env(safe-area-inset-bottom));}
nav.tabs button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;}
nav.tabs button .ic{font-size:1.05rem;line-height:1;opacity:.7;}
nav.tabs button.active{color:var(--text);}
nav.tabs button.active .ic{opacity:1;}
.deck{flex:1;display:flex;perspective:1400px;margin:4px 0 0;}
.flip{position:relative;width:100%;min-height:56vh;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);}
.flip.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;}
.face.back{transform:rotateY(180deg);}
.cat-seal{font-size:.6rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:14px;}
.kanji{font-size:1.9rem;font-weight:400;color:var(--accent);letter-spacing:.06em;margin-bottom:6px;}
.kanji-sm{font-size:1.05rem;color:var(--accent);margin:6px 0;}
.jp{font-size:2rem;font-weight:600;line-height:1.15;color:var(--text);}
.pron{margin-top:8px;font-size:.95rem;color:var(--muted);}
.de{font-size:1.45rem;font-weight:600;color:var(--text);margin-bottom:4px;}
.lit{font-size:.9rem;color:var(--muted);max-width:300px;margin-top:6px;}
.svgwrap{margin:0 0 14px;}
.svgwrap svg{width:78px;height:78px;}
.tap-hint{position:absolute;bottom:16px;font-size:.7rem;color:var(--muted);opacity:.5;}
.speak{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-family:inherit;font-size:.88rem;font-weight:500;cursor:pointer;}
.speak:active{transform:scale(.97);}
.progress-line{flex:none;height:3px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:0 2px;}
.progress-line i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s;}
.boxdots{display:flex;gap:5px;justify-content:center;margin-top:16px;align-items:center;}
.boxdots span{width:7px;height:7px;border-radius:50%;background:var(--surface2);}
.boxdots span.on{background:var(--accent);}
.grade{flex:none;display:flex;gap:10px;margin-top:14px;}
.grade button{flex:1;border-radius:14px;padding:15px 8px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted);}
.grade .got{background:var(--accent);color:#10141a;border-color:var(--accent);}
.grade button:active{transform:translateY(1px);}
.note{flex:none;font-size:.72rem;color:var(--muted);text-align:center;margin:12px 8px 0;line-height:1.4;}
.qcard{margin:4px 0 0;}
.qprompt-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);text-align:center;}
.qkanji{text-align:center;color:var(--accent);font-size:1.2rem;margin:12px 0 0;}
.qprompt{font-size:1.7rem;font-weight:600;text-align:center;margin:4px 0 6px;color:var(--text);}
.qprompt.small{font-size:1.3rem;}
.qpron{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:6px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:15px 16px;font-family:inherit;font-size:1rem;font-weight:400;text-align:left;cursor:pointer;}
.opt:active{transform:scale(.99);}
.opt.correct{border-color:var(--good);color:var(--good);}
.opt.wrong{border-color:var(--bad);color:var(--bad);}
.opt.dim{opacity:.38;}
.qfb{text-align:center;font-weight:600;margin-top:16px;color:var(--text);}
.deepen-btn{display:block;margin:12px auto 0;background:none;border:none;color:var(--accent);font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;}
.deepen{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.86rem;color:var(--muted);}
.deepen a{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;text-decoration:none;}
.qnav{display:flex;gap:10px;margin-top:18px;}
.qnav .back{flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:14px 18px;font-family:inherit;font-weight:600;font-size:.92rem;cursor:pointer;}
.qnav .fwd{flex:1;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:14px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.nb-target{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin:4px 0 2px;}
.nb-target .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);}
.nb-target .desc{font-size:1.1rem;font-weight:600;margin-top:8px;color:var(--text);}
.nb-row{margin:16px 0;}
.nb-row h4{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600;}
.nb-opts{display:flex;flex-wrap:wrap;gap:8px;}
.nb-pick{border:1px solid var(--line);background:none;color:var(--text);border-radius:11px;padding:9px 13px;font-family:inherit;font-size:.84rem;font-weight:400;cursor:pointer;}
.nb-pick.sel{border-color:var(--accent);color:var(--accent);}
.nb-pick.ok{border-color:var(--good);color:var(--good);}
.nb-pick.bad{border-color:var(--bad);color:var(--bad);}
.nb-check{width:100%;margin-top:10px;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.nb-feedback{text-align:center;font-weight:600;margin-top:14px;min-height:22px;font-size:1rem;color:var(--text);}
.grouphead{font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;margin:20px 2px 8px;color:var(--muted);}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.row .rjp{font-weight:600;font-size:.98rem;}
.row .rjp small{font-weight:400;color:var(--accent);margin-left:7px;font-size:.85em;}
.row .rde{font-size:.78rem;color:var(--muted);margin-top:2px;}
.row .rmid{flex:1;min-width:0;cursor:pointer;}
.row .rspeak{flex:none;background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer;color:var(--accent);}
.row .mdots{display:flex;gap:3px;margin-top:6px;}
.row .mdots span{width:6px;height:6px;border-radius:50%;background:var(--surface2);}
.row .mdots span.on{background:var(--accent);}
.reset{display:block;margin:22px auto 8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:9px 20px;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.92rem;margin:auto;}
.summary{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.sum-num{font-size:3rem;font-weight:600;color:var(--accent);line-height:1;}
.sum-lbl{font-size:.92rem;color:var(--muted);margin-top:8px;}
.sum-sub{font-size:.8rem;color:var(--muted);margin-top:12px;letter-spacing:.02em;}
.sum-go{margin-top:30px;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:14px 30px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.detail{position:fixed;inset:0;z-index:50;max-width:520px;margin:0 auto;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(8px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));}
.detail.open{display:flex;}
.dt-back{align-self:flex-start;background:none;border:none;color:var(--accent);font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:6px;}
.dt-head{text-align:center;}
.dt-seal{font-size:.6rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);}
.dt-kanji{font-size:2.4rem;color:var(--accent);letter-spacing:.06em;margin:12px 0 2px;}
.dt-jp{font-size:1.8rem;font-weight:600;color:var(--text);line-height:1.15;}
.dt-pron{color:var(--muted);font-size:.95rem;margin-top:4px;}
.dt-de{font-size:1.15rem;font-weight:600;color:var(--text);margin:16px 0 0;text-align:center;}
.dt-metaphor{margin:18px 0 0;padding:14px 16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;color:var(--text);font-size:1rem;line-height:1.5;}
.dt-sec{margin-top:24px;}
.dt-sec h4{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0 0 10px;}
.dt-lit{font-size:.96rem;color:var(--text);line-height:1.5;}
.dt-steps{margin:0;padding:0;list-style:none;counter-reset:step;}
.dt-steps li{position:relative;padding:8px 0 8px 32px;color:var(--text);font-size:.93rem;line-height:1.45;border-bottom:1px solid var(--line);}
.dt-steps li:last-child{border-bottom:none;}
.dt-steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:7px;width:21px;height:21px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;}
.dt-diagram{display:flex;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.dt-diagram svg{width:100%;max-width:190px;height:auto;}
.dt-diagram-cap{text-align:center;margin-top:10px;font-size:.92rem;color:var(--text);line-height:1.42;}
.dt-phases{display:flex;flex-direction:column;gap:10px;}
.dt-phase{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.dt-ph-img{flex:none;width:84px;height:84px;}
.dt-ph-img svg{width:100%;height:100%;display:block;}
.dt-ph-cap{font-size:.92rem;color:var(--text);line-height:1.42;}
.dt-ph-cap b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#10141a;font-size:.72rem;align-items:center;justify-content:center;margin-right:9px;vertical-align:middle;}
.dt-legend{display:flex;gap:18px;justify-content:center;margin-top:12px;font-size:.72rem;color:var(--muted);}
.dt-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;}
.dt-rel{display:flex;flex-wrap:wrap;gap:8px;}
.dt-rel button{background:none;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:8px 12px;font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer;}
.dt-rel button small{color:var(--accent);margin-left:6px;font-weight:400;}
.dt-video{display:inline-block;color:var(--accent);font-weight:600;text-decoration:none;font-size:.9rem;}
.dt-open{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--accent);font-family:inherit;font-size:.84rem;font-weight:600;cursor:pointer;border-radius:999px;padding:8px 16px;}
.t-streak{font-size:.95rem;color:var(--text);margin:2px 2px 12px;}
.t-streak b{color:var(--accent);font-size:1.15rem;}
.t-streak .sub{color:var(--muted);}
.heat{display:grid;grid-template-rows:repeat(7,9px);grid-auto-flow:column;gap:3px;justify-content:start;margin:0 2px 18px;}
.heat i{width:9px;height:9px;border-radius:2px;background:var(--surface2);}
.heat i.on{background:var(--accent);}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
.t-card h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:0 0 12px;}
.drill{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.drill:last-of-type{border-bottom:none;}
.drill .dn{flex:1;min-width:0;}
.drill .dn b{font-weight:600;color:var(--text);font-size:.95rem;}
.drill .dn small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px;}
.drill .play{flex:none;background:none;border:1px solid var(--line);color:var(--accent);border-radius:9px;padding:6px 11px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;}
.t-btn{display:block;width:100%;background:none;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:.92rem;font-weight:500;cursor:pointer;text-align:left;margin-top:8px;}
.t-btn.t-accent{background:var(--accent);color:#10141a;border:none;font-weight:600;text-align:center;}
.timer{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;}
.timer .tt{font-size:1.7rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;min-width:64px;text-align:center;}
.timer button{background:none;border:1px solid var(--line);color:var(--accent);border-radius:10px;padding:8px 15px;font-family:inherit;font-weight:600;font-size:.9rem;cursor:pointer;}
.rep{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.rep label{flex:1;font-size:.95rem;color:var(--text);}
.rep input{width:74px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:1rem;text-align:center;}
.rep small{width:66px;text-align:right;color:var(--muted);font-size:.78rem;}
.rep-h{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--text);}
.rep-h b{color:var(--accent);margin-right:8px;}
.logrow{display:flex;flex-wrap:wrap;gap:8px;}
.logchip{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:8px 13px;font-family:inherit;font-size:.85rem;font-weight:500;cursor:pointer;}
.logchip.on{border-color:var(--accent);color:var(--accent);}
.belt{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:2px 0 7px;}
.belt i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s;}
.belt-lbl{font-size:.82rem;color:var(--muted);}
.ach{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;}
.ach span{font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 9px;}
.ach span.got{color:var(--good);border-color:var(--good);}
.examq{font-size:1.05rem;color:var(--text);font-weight:600;line-height:1.4;}
.exa{color:var(--accent);font-weight:600;font-size:1.05rem;}
.fade{animation:fade .35s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">六&nbsp; Vokabel-Dojo</div>
    <button class="menubtn" id="menubtn" aria-label="Menü">⋯</button>
  </div>
  <div class="masterbar" id="masterbar" aria-label="Gesamtfortschritt"><i id="mbar"></i></div>
  <div class="panel" id="panel">
    <div class="stats">
      <div class="stat"><div class="num" id="st-total">0</div><div class="lbl">Karten</div></div>
      <div class="stat"><div class="num" id="st-master">0</div><div class="lbl">gemeistert</div></div>
      <div class="stat streak"><div class="num" id="st-days">0</div><div class="lbl">Tage</div></div>
    </div>
    <div id="catwrap"></div>
  </div>

  <main id="view"></main>

  <nav class="tabs">
    <button data-mode="learn" class="active"><span class="ic">🥋</span>Lernen</button>
    <button data-mode="quiz"><span class="ic">✦</span>Quiz</button>
    <button data-mode="build"><span class="ic">⛩</span>Namen</button>
    <button data-mode="today"><span class="ic">稽</span>Üben</button>
    <button data-mode="browse"><span class="ic">≣</span>Liste</button>
  </nav>
</div>

/* ---------- Persistenz ---------- */
const Store={
  mem:{},
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r&&r.value? JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){}
    return (k in this.mem)?this.mem[k]:null;
  },
  async set(k,v){
    this.mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); } }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }
};
let progress={}, bestStreak=0, curStreak=0;
let dayStreak=0, dayLast='';   // Tages-Streak: aufeinanderfolgende Übungstage
function pget(t){ if(!progress[t]) progress[t]={box:1,seen:0,correct:0}; return progress[t]; }
async function saveProgress(){ await Store.set('aikido_progress',progress); await Store.set('aikido_streak',{best:bestStreak}); }
function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){
  const t=dayKey(new Date());
  if(dayLast===t) return;                       // heute schon gezählt
  const y=new Date(); y.setDate(y.getDate()-1);
  dayStreak = (dayLast===dayKey(y)) ? dayStreak+1 : 1;   // Folgetag → +1, sonst neu
  dayLast=t;
  Store.set('aikido_days',{streak:dayStreak,last:dayLast});
  updateStats();
}

/* ---------- Aussprache (japanische Schrift bevorzugt, Stimme wählbar) ---------- */
let allVoices=[];
function loadVoices(){ try{ allVoices=speechSynthesis.getVoices()||[]; }catch(e){ allVoices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function jaVoices(){ return allVoices.filter(v=>(v.lang||'').toLowerCase().startsWith('ja')); }
function pickVoice(){   // stiller Notfall-Fallback: beste verfügbare japanische Stimme
  const js=jaVoices(); if(!js.length) return null;
  const better=js.find(v=>/enhanced|erweitert|premium|拡張|neural|siri|高品質/i.test(v.name||''));
  return better||js[0];
}
let _audio=null, _urls={};
function audioURL(jp){
  if(_urls[jp]!==undefined) return _urls[jp];
  const b64=(window.AUDIO||{})[jp];
  if(!b64){ _urls[jp]=null; return null; }
  try{
    const raw=atob(b64.split(',')[1]);
    const arr=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
    _urls[jp]=URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}));
  }catch(e){ _urls[jp]=null; }
  return _urls[jp];
}
function speakCard(card){
  const url=audioURL(card.jp);
  if(url){
    try{
      if(!_audio) _audio=new Audio();
      _audio.onended=null;
      _audio.src=url;
      const p=_audio.play();
      if(p&&p.catch) p.catch(()=>speak(card.ja||card.jp));
      return;
    }catch(e){}
  }
  speak(card.ja || card.jp);
}
function speakSeq(jps){
  // mehrere eingebettete Aufnahmen nacheinander – gleiche Stimme wie überall sonst
  if(!_audio) _audio=new Audio();
  const a=_audio; a.onended=null;
  let i=0;
  const step=()=>{
    if(i>=jps.length){ a.onended=null; return; }
    const jp=jps[i++];
    const url=audioURL(jp);
    if(url){
      a.onended=step;
      a.src=url;
      const p=a.play();
      if(p&&p.catch) p.catch(()=>{ a.onended=null; const c=VOCAB.find(v=>v.jp===jp); speak(c?(c.ja||c.jp):jp); });
    } else {
      a.onended=null;
      const c=VOCAB.find(v=>v.jp===jp); speak(c?(c.ja||c.jp):jp);
      step();
    }
  };
  step();
}
function speakName(t){
  // Technik+Richtung als kombinierten Vokabel-Key (z. B. „Ikkyo Omote"), sonst nur die Technik
  const tech=(t.d && t.d!=='—') ? t.t+' '+t.d : t.t;
  speakSeq([t.a, tech]);
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/\s+/g,'').replace(/\(.+?\)/g,''));
    u.rate=0.78; u.pitch=1;
    const v=pickVoice();
    if(v){ u.voice=v; u.lang=v.lang||'ja-JP'; } else { u.lang='ja-JP'; }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- LERNEN ---------- */
const ROUND=10;  // Runden-Häppchen: so viele Karten/Fragen pro Durchgang
let learnQueue=[], learnIdx=0, isFlipped=false, learnGot=0;
function buildQueue(){
  // schwächste Karten zuerst (niedrigste Leitner-Box), dann auf ein Häppchen begrenzen
  learnQueue=[...filtered()].sort((a,b)=>{ const pa=pget(a.jp),pb=pget(b.jp); if(pa.box!==pb.box) return pa.box-pb.box; return Math.random()-.5; }).slice(0,ROUND);
  learnIdx=0; isFlipped=false; learnGot=0;
}
function renderLearnSummary(){
  const n=learnQueue.length, f=filtered();
  const mastered=f.filter(v=>pget(v.jp).box>=5).length;
  view.innerHTML=`<div class="summary fade">
    <div class="sum-num">${learnGot}/${n}</div>
    <div class="sum-lbl">in dieser Runde gewusst</div>
    <div class="sum-sub">${mastered} von ${f.length} Karten gemeistert</div>
    <button class="sum-go" id="learn-next">Neue Runde</button>
  </div>`;
  bindChips();
  document.getElementById('learn-next').onclick=()=>{ buildQueue(); renderLearn(); };
}
function renderLearn(){
  if(!learnQueue.length) buildQueue();
  if(learnIdx>=learnQueue.length){ renderLearnSummary(); return; }
  const card=learnQueue[learnIdx];
  if(!card){ view.innerHTML='<div class="empty">Keine Karten in dieser Kategorie.</div>'; bindChips(); return; }
  const p=pget(card.jp);
  const dots=[1,2,3,4,5].map(i=>'<span class="'+(i<=p.box?'on':'')+'"></span>').join('');
  view.innerHTML=`
    <div class="progress-line"><i style="width:${Math.round((learnIdx/learnQueue.length)*100)}%"></i></div>
    <div class="deck fade">
      <div class="flip${isFlipped?' flipped':''}" id="flip">

          <div class="cat-seal">${CATS[card.c]}</div>
          <div class="kanji">${card.ja}</div>

          <button class="speak" id="spk1">▶︎ hören</button>
          <div class="tap-hint">tippen zum Umdrehen</div>
        </div>
        <div class="face back">
          <div class="cat-seal">${CATS[card.c]}</div>
          <div class="svgwrap">${iconForCard(card)}</div>
          <div class="de">${card.de}</div>
          <div class="kanji-sm">${card.ja}</div>
          ${card.lit?`<div class="lit">${card.lit}</div>`:''}
          <button class="speak" id="spk2">▶︎ hören</button>
          <div class="boxdots">${dots}</div>
          <button class="dt-open" id="dt-learn" data-jp="${card.jp.replace(/"/g,'&quot;')}">vertiefen ↗</button>
        </div>
      </div>
    </div>
    <div class="grade">
      <button class="again" id="g-again">Nochmal</button>
      <button class="got" id="g-got">Gewusst ✓</button>
    </div>
    <div class="note">${learnIdx+1} / ${learnQueue.length} · die Punkte = deine Leitner-Stufe (5 = gemeistert)</div>`;
  bindChips();
  const flip=document.getElementById('flip');
  flip.onclick=(e)=>{ if(e.target.closest('.speak,.dt-open'))return; isFlipped=!isFlipped; flip.classList.toggle('flipped'); };
  document.getElementById('spk1').onclick=(e)=>{e.stopPropagation();speakCard(card);};
  document.getElementById('spk2').onclick=(e)=>{e.stopPropagation();speakCard(card);};
  document.getElementById('dt-learn').onclick=(e)=>{e.stopPropagation();openDetail(card.jp);};
  document.getElementById('g-again').onclick=()=>grade(card,false);
  document.getElementById('g-got').onclick=()=>grade(card,true);
  speakCard(card);   // neue Karte erscheint → automatisch vorlesen
}
async function grade(card,ok){
  const p=pget(card.jp); p.seen++; touchDay(); markLog('Vokabeln');
  if(ok){ p.box=Math.min(5,p.box+1); p.correct++; learnGot++; } else { p.box=1; }
  await saveProgress(); learnIdx++; isFlipped=false; updateStats();
  if(learnIdx>=learnQueue.length){ renderLearnSummary(); return; }
  renderLearn();
}

/* ---------- QUIZ (mit Verlauf + Vertiefen) ---------- */
let quizHist=[], qIdx=-1;
function rnd(){return Math.random()-.5;}
function makeQuestion(){
  const pool=filtered();
  const card=pool[Math.floor(Math.random()*pool.length)];
  const dir=Math.random()<.5?'jp2de':'de2jp';
  const correct = dir==='jp2de'? card.de : card.jp;
  const distract=[...pool].filter(v=>v.jp!==card.jp).sort(rnd).slice(0,3).map(v=> dir==='jp2de'? v.de : v.jp);
  const opts=[correct,...distract].sort(rnd);
  quizHist.push({card,dir,correct,opts,chosen:null,open:false});
  qIdx=quizHist.length-1; showQuestion();
  if(dir==='jp2de') speakCard(card);   // japanisch gezeigt → vorlesen (de2jp würde die Lösung verraten)
}
function startQuiz(){
  if(filtered().length<4){ view.innerHTML='<div class="empty">Mind. 4 Karten nötig – wähle „Alle“ oder eine größere Kategorie.</div>'; bindChips(); return; }
  quizHist=[]; qIdx=-1; makeQuestion();
}
function showQuestion(){
  const q=quizHist[qIdx], card=q.card, answered=q.chosen!==null;
  const head = q.dir==='jp2de'
    ? `<div class="qprompt-label">Was bedeutet …</div><div class="qkanji">${card.ja}</div><div class="qprompt">${card.jp}</div><div class="qpron">${card.pr}</div>`
    : `<div class="qprompt-label">Wie heißt auf Japanisch …</div><div class="qprompt small">${card.de}</div>`;
  let optsHTML=q.opts.map(o=>{
    let cls='opt';
    if(answered){ if(o===q.correct)cls+=' correct'; else if(o===q.chosen)cls+=' wrong'; else cls+=' dim'; }
    return `<button class="${cls}" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`;
  }).join('');
  let after='';
  if(answered){
    const ok=q.chosen===q.correct;
    const last=qIdx===quizHist.length-1 && quizHist.length>=ROUND;
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent('Aikido '+card.jp+' Heuscher');
    after=`<div class="qfb">${ok?'✓ Richtig':'✗ '+card.jp+' = '+card.de}</div>
      <button class="deepen-btn" id="deepen">Mehr dazu ▾</button>
      <div class="deepen" id="deepbox" style="display:${q.open?'block':'none'}">
        <div>${card.ja} · <i>${card.pr}</i></div>
        ${card.lit?`<div style="margin-top:4px">${card.lit}</div>`:''}
        <a href="${yt}" target="_blank" rel="noopener">Auf YouTube ansehen ↗</a>
        <button class="dt-open" id="dt-quiz" data-jp="${card.jp.replace(/"/g,'&quot;')}">vertiefen ↗</button>
      </div>
      <div class="qnav">
        ${qIdx>0?'<button class="back" id="qback">← zurück</button>':''}
        <button class="fwd" id="qfwd">${last?'Ergebnis →':'Weiter →'}</button>
      </div>`;
  } else {
    after = qIdx>0 ? `<div class="qnav"><button class="back" id="qback">← zurück</button></div>` : '';
  }
  view.innerHTML=`<div class="qcard fade">${head}<div class="opts">${optsHTML}</div>${after}</div>
    <div class="note">Frage ${qIdx+1} / ${ROUND} · Serie ${bestStreak}</div>`;
  bindChips();
  if(!answered){ view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQuiz(q,b.dataset.o)); }
  const db=document.getElementById('deepen'); if(db) db.onclick=()=>{ q.open=!q.open; document.getElementById('deepbox').style.display=q.open?'block':'none'; };
  const dq=document.getElementById('dt-quiz'); if(dq) dq.onclick=()=>openDetail(q.card.jp);
  const bk=document.getElementById('qback'); if(bk) bk.onclick=()=>{ qIdx--; showQuestion(); };
  const fw=document.getElementById('qfwd'); if(fw) fw.onclick=()=>{
    if(qIdx<quizHist.length-1){ qIdx++; showQuestion(); }
    else if(quizHist.length>=ROUND){ showQuizSummary(); }
    else makeQuestion();
  };
}
function showQuizSummary(){
  const n=quizHist.length;
  const right=quizHist.filter(q=>q.chosen===q.correct).length;
  view.innerHTML=`<div class="summary fade">
    <div class="sum-num">${right}/${n}</div>
    <div class="sum-lbl">richtig in dieser Runde</div>
    <div class="sum-sub">längste Serie: ${bestStreak}</div>
    <button class="sum-go" id="quiz-next">Neue Runde</button>
  </div>`;
  bindChips();
  document.getElementById('quiz-next').onclick=()=>startQuiz();
}
async function answerQuiz(q,chosen){
  if(q.chosen!==null) return;
  q.chosen=chosen;
  const p=pget(q.card.jp); p.seen++; touchDay(); markLog('Vokabeln');
  if(chosen===q.correct){ p.box=Math.min(5,p.box+1); p.correct++; curStreak++; if(curStreak>bestStreak)bestStreak=curStreak; speakCard(q.card); }
  else { p.box=1; curStreak=0; }
  await saveProgress(); updateStats(); showQuestion();
}

function relatedTerms(card){
  const out=[], g=GUIDE[card.jp];
  if(g&&g.rel) g.rel.forEach(j=>{ const c=VOCAB.find(v=>v.jp===j); if(c&&!out.includes(c))out.push(c); });
  const words=card.jp.toLowerCase().split(/[\s()]+/).filter(w=>w.length>2);
  VOCAB.forEach(v=>{ if(v.jp===card.jp||out.includes(v))return; const vj=v.jp.toLowerCase();
    if(words.some(w=>w===vj||(vj.length>2&&w.includes(vj))||w.includes(vj))) out.push(v); });
  VOCAB.forEach(v=>{ if(out.length>=6)return; if(v.c===card.c&&v.jp!==card.jp&&!out.includes(v)) out.push(v); });
  return out.slice(0,6);
}

const VAPID_PUBLIC='BL-Dc3vpjNEkrr1k2-5ytmhjThSN1hTZ39sUZnSzzLfyrZw5m63R8oR1xDPbT-nxzXqK1AarGVOnl8cbblO2tKM';
function urlB64(s){ const pad='='.repeat((4-s.length%4)%4); const b=(s+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
async function enableReminder(){
  const st=document.getElementById('rem-state');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){ if(st) st.textContent='Push wird hier nicht unterstützt – App über „Zum Home-Bildschirm“ installieren.'; return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ if(st) st.textContent='Erinnerung nicht erlaubt (ggf. in den iOS-Einstellungen freigeben).'; return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){ // bestehende Anmeldung verwerfen, falls sie mit einem anderen VAPID-Key erstellt wurde
      const cur=urlB64(VAPID_PUBLIC);
      const ex=sub.options&&sub.options.applicationServerKey?new Uint8Array(sub.options.applicationServerKey):null;
      const same=ex&&ex.length===cur.length&&ex.every((b,i)=>b===cur[i]);
      if(!same){ try{ await fetch('/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)}); }catch(_){} try{ await sub.unsubscribe(); }catch(_){} sub=null; }
    }
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(VAPID_PUBLIC)});
    const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
    const payload=Object.assign(JSON.parse(JSON.stringify(sub)),{time:remindTime,tz});
    const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){ pushOn=true; await Store.set('aikido_push',{on:true,time:remindTime}); }
    else { if(st) st.textContent='Server noch nicht bereit (Backend/Store eingerichtet?).'; return; }
  }catch(e){ if(st) st.textContent='Konnte nicht aktivieren: '+(e.message||e); return; }
  renderToday();
}
async function disableReminder(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ try{ await fetch('/api/subscribe',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)}); }catch(_){} try{ await sub.unsubscribe(); }catch(_){} }
  }catch(_){}
  pushOn=false; await Store.set('aikido_push',{on:false,time:remindTime}); renderToday();
}
function todayKey(){ return dayKey(new Date()); }
function todayLog(){ return logData[todayKey()]||[]; }
function setTodayLog(arr){ if(arr&&arr.length) logData[todayKey()]=arr; else delete logData[todayKey()]; Store.set('aikido_log',logData); }
function markLog(tag){ const t=todayLog(); if(!t.includes(tag)){ t.push(tag); setTodayLog(t); } }
function toggleLogTag(tag){ const t=todayLog(); const i=t.indexOf(tag); if(i<0){ t.push(tag); touchDay(); } else t.splice(i,1); setTodayLog(t); }
function pickDrills(){ drillPick=[...DRILLS].sort(()=>Math.random()-.5).slice(0,3); }
function fmtTime(s){ const m=Math.floor(s/60), x=s%60; return m+':'+(x<10?'0':'')+x; }
function stopTimer(){ if(_timerId){ clearInterval(_timerId); _timerId=null; } }
function heatmapHTML(){ let c=''; const t=new Date(); for(let i=69;i>=0;i--){ const d=new Date(t); d.setDate(d.getDate()-i); c+=`<i class="${dayPracticed(dayKey(d))?'on':''}"></i>`; } return `<div class="heat">${c}</div>`; }
function beltPct(){ return Math.round(VOCAB.filter(v=>pget(v.jp).box>=5).length / VOCAB.length * 100); }
function practiceDays(){ const s=new Set([...Object.keys(logData),...Object.keys(repsData)].filter(dayPracticed)); return s.size; }
function achievements(){
  const m=VOCAB.filter(v=>pget(v.jp).box>=5).length;
  const zahlen=VOCAB.filter(v=>v.c==='zahlen');
  return [
    {t:'7-Tage-Serie',got:dayStreak>=7},
    {t:'Alle Zahlen',got:zahlen.length>0&&zahlen.every(v=>pget(v.jp).box>=5)},
    {t:'25 gemeistert',got:m>=25},
    {t:'10 Übungstage',got:practiceDays()>=10},
    {t:'Halbe Strecke',got:beltPct()>=50}
  ];
}
function newExamTask(){ examTask={e:EXAM[Math.floor(Math.random()*EXAM.length)],open:false}; }
/* Kraft-Tracker: tägliche Mengen + Verlauf */
let repsData={};
const REPS=[{f:'push',t:'Liegestütze',u:''},{f:'squat',t:'Kniebeugen',u:''},{f:'plank',t:'Plank',u:'Sek.'}];
function todayReps(){ return repsData[todayKey()]||{}; }
function setReps(f,val){ const k=todayKey(), r=repsData[k]||{}, n=parseInt(val,10); if(n>0) r[f]=n; else delete r[f]; if(Object.keys(r).length) repsData[k]=r; else delete repsData[k]; Store.set('aikido_reps',repsData); touchDay(); }
function lastReps(f){ const ks=Object.keys(repsData).filter(k=>k!==todayKey()&&repsData[k][f]).sort(); const k=ks[ks.length-1]; return k?repsData[k][f]:null; }
function fmtDate(k){ const p=k.split('-'); return p[2]+'.'+p[1]+'.'; }
function dayPracticed(k){ return ((logData[k]||[]).length>0) || (repsData[k]&&Object.keys(repsData[k]).length>0); }
function openRepsHistory(){
  const keys=Object.keys(repsData).sort().reverse().slice(0,30);
  const body = keys.length ? keys.map(k=>{ const r=repsData[k], p=[]; if(r.push)p.push(r.push+' Liegestütze'); if(r.squat)p.push(r.squat+' Kniebeugen'); if(r.plank)p.push(r.plank+'s Plank'); return `<div class="rep-h"><b>${fmtDate(k)}</b> ${p.join(' · ')}</div>`; }).join('') : '<div class="dt-lit">Noch keine Einträge.</div>';

function startTimer(sec){
  stopTimer(); _timerLeft=sec;
  const tw=document.getElementById('timer'); if(tw) tw.style.display='flex';
  const tt=document.getElementById('tt'), ss=document.getElementById('t-startstop');
  if(tt) tt.textContent=fmtTime(_timerLeft);
  const tick=()=>{ _timerLeft--; if(tt) tt.textContent=fmtTime(Math.max(0,_timerLeft)); if(_timerLeft<=0){ stopTimer(); if(ss) ss.textContent='Fertig ✓'; try{ speak('はい'); }catch(e){} } };
  _timerId=setInterval(tick,1000);
  if(ss){ ss.textContent='Pause'; ss.onclick=()=>{ if(_timerId){ stopTimer(); ss.textContent='Weiter'; } else { _timerId=setInterval(tick,1000); ss.textContent='Pause'; } }; }
  const rs=document.getElementById('t-reset'); if(rs) rs.onclick=()=>{ stopTimer(); _timerLeft=sec; if(tt) tt.textContent=fmtTime(sec); if(ss) ss.textContent='Start'; };
}
function openRoutine(key){
  const r=ROUTINES[key]; if(!r) return;

}
function renderToday(){

  view.querySelectorAll('.rep input').forEach(inp=>inp.onchange=()=>{ setReps(inp.dataset.f, inp.value); renderToday(); });
