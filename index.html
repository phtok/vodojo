<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aikido Vokabel-Dojo · 6. Kyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dojo">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0f1113; --surface:#181b20; --surface2:#1f242b; --line:#262b32;
  --text:#e9e4d7; --muted:#84817a; --accent:#9bb4d4; --good:#73b08a; --bad:#cf8268;
  --font:'Inclusive Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}
.app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;}
.brand{font-size:.95rem;font-weight:600;letter-spacing:.02em;color:var(--text);}
.menubtn{background:none;border:none;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 10px;border-radius:8px;}
.app.menuopen .menubtn{color:var(--accent);}
.panel{flex:none;display:none;padding:2px 16px 12px;border-bottom:1px solid var(--line);}
.app.menuopen .panel{display:block;}
.stats{display:flex;gap:10px;margin:6px 0 14px;}
.stat{flex:1;text-align:center;}
.stat .num{font-size:1.3rem;font-weight:600;color:var(--text);line-height:1;}
.stat .lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:4px;}
.stat.streak .num{color:var(--accent);}
.masterbar{flex:none;height:3px;margin:2px 18px 0;background:var(--surface2);border-radius:99px;overflow:hidden;}
.masterbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1);}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px;}
.chip{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.84rem;font-weight:500;padding:3px 0;cursor:pointer;border-bottom:2px solid transparent;}
.chip.active{color:var(--text);border-bottom-color:var(--accent);}
main#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 18px;display:flex;flex-direction:column;}
nav.tabs{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));}
nav.tabs button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;}
nav.tabs button .ic{font-size:1.05rem;line-height:1;opacity:.7;}
nav.tabs button.active{color:var(--text);}
nav.tabs button.active .ic{opacity:1;}
.deck{flex:1;display:flex;perspective:1400px;margin:4px 0 0;}
.flip{position:relative;width:100%;min-height:56vh;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);}
.flip.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;}
.face.back{transform:rotateY(180deg);}
.cat-seal{font-size:.6rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:14px;}
.kanji{font-size:1.9rem;font-weight:400;color:var(--accent);letter-spacing:.06em;margin-bottom:6px;}
.kanji-sm{font-size:1.05rem;color:var(--accent);margin:6px 0;}
.jp{font-size:2rem;font-weight:600;line-height:1.15;color:var(--text);}
.pron{margin-top:8px;font-size:.95rem;color:var(--muted);}
.de{font-size:1.45rem;font-weight:600;color:var(--text);margin-bottom:4px;}
.lit{font-size:.9rem;color:var(--muted);max-width:300px;margin-top:6px;}
.svgwrap{margin:0 0 14px;}
.svgwrap svg{width:78px;height:78px;}
.tap-hint{position:absolute;bottom:16px;font-size:.7rem;color:var(--muted);opacity:.5;}
.speak{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-family:inherit;font-size:.88rem;font-weight:500;cursor:pointer;}
.speak:active{transform:scale(.97);}
.progress-line{flex:none;height:3px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:0 2px;}
.progress-line i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s;}
.boxdots{display:flex;gap:5px;justify-content:center;margin-top:16px;align-items:center;}
.boxdots span{width:7px;height:7px;border-radius:50%;background:var(--surface2);}
.boxdots span.on{background:var(--accent);}
.boxdots .lab{font-size:.58rem;color:var(--muted);margin-right:6px;letter-spacing:.08em;text-transform:uppercase;}
.grade{flex:none;display:flex;gap:10px;margin-top:14px;}
.grade button{flex:1;border-radius:14px;padding:15px 8px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted);}
.grade .got{background:var(--accent);color:#10141a;border-color:var(--accent);}
.grade button:active{transform:translateY(1px);}
.note{flex:none;font-size:.72rem;color:var(--muted);text-align:center;margin:12px 8px 0;line-height:1.4;}
.qcard{margin:4px 0 0;}
.qprompt-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);text-align:center;}
.qkanji{text-align:center;color:var(--accent);font-size:1.2rem;margin:12px 0 0;}
.qprompt{font-size:1.7rem;font-weight:600;text-align:center;margin:4px 0 6px;color:var(--text);}
.qprompt.small{font-size:1.3rem;}
.qpron{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:6px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:15px 16px;font-family:inherit;font-size:1rem;font-weight:400;text-align:left;cursor:pointer;}
.opt:active{transform:scale(.99);}
.opt.correct{border-color:var(--good);color:var(--good);}
.opt.wrong{border-color:var(--bad);color:var(--bad);}
.opt.dim{opacity:.38;}
.qfb{text-align:center;font-weight:600;margin-top:16px;color:var(--text);}
.deepen-btn{display:block;margin:12px auto 0;background:none;border:none;color:var(--accent);font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;}
.deepen{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.86rem;color:var(--muted);}
.deepen a{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;text-decoration:none;}
.qnav{display:flex;gap:10px;margin-top:18px;}
.qnav .back{flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:14px 18px;font-family:inherit;font-weight:600;font-size:.92rem;cursor:pointer;}
.qnav .fwd{flex:1;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:14px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.nb-target{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin:4px 0 2px;}
.nb-target .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);}
.nb-target .desc{font-size:1.1rem;font-weight:600;margin-top:8px;color:var(--text);}
.nb-row{margin:16px 0;}
.nb-row h4{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600;}
.nb-opts{display:flex;flex-wrap:wrap;gap:8px;}
.nb-pick{border:1px solid var(--line);background:none;color:var(--text);border-radius:11px;padding:9px 13px;font-family:inherit;font-size:.84rem;font-weight:400;cursor:pointer;}
.nb-pick.sel{border-color:var(--accent);color:var(--accent);}
.nb-pick.ok{border-color:var(--good);color:var(--good);}
.nb-pick.bad{border-color:var(--bad);color:var(--bad);}
.nb-check{width:100%;margin-top:10px;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.nb-feedback{text-align:center;font-weight:600;margin-top:14px;min-height:22px;font-size:1rem;color:var(--text);}
.grouphead{font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;margin:20px 2px 8px;color:var(--muted);}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.row .rjp{font-weight:600;font-size:.98rem;}
.row .rjp small{font-weight:400;color:var(--accent);margin-left:7px;font-size:.85em;}
.row .rde{font-size:.78rem;color:var(--muted);margin-top:2px;}
.row .rmid{flex:1;min-width:0;}
.row .rspeak{flex:none;background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer;color:var(--accent);}
.row .mdots{display:flex;gap:3px;margin-top:6px;}
.row .mdots span{width:6px;height:6px;border-radius:50%;background:var(--surface2);}
.row .mdots span.on{background:var(--accent);}
.reset{display:block;margin:22px auto 8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:9px 20px;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.92rem;margin:auto;}
.summary{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.sum-num{font-size:3rem;font-weight:600;color:var(--accent);line-height:1;}
.sum-lbl{font-size:.92rem;color:var(--muted);margin-top:8px;}
.sum-sub{font-size:.8rem;color:var(--muted);margin-top:12px;letter-spacing:.02em;}
.sum-go{margin-top:30px;background:var(--accent);color:#10141a;border:none;border-radius:14px;padding:14px 30px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;}
.fade{animation:fade .35s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>

<div class="app">
  <div class="topbar">

  <main id="view"></main>

/* ---------- Persistenz ---------- */
const Store={
  mem:{},
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r&&r.value? JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){}
    return (k in this.mem)?this.mem[k]:null;
  },
  async set(k,v){
    this.mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); } }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }
};
let progress={}, bestStreak=0, curStreak=0;
let dayStreak=0, dayLast='';   // Tages-Streak: aufeinanderfolgende Übungstage
function pget(t){ if(!progress[t]) progress[t]={box:1,seen:0,correct:0}; return progress[t]; }
async function saveProgress(){ await Store.set('aikido_progress',progress); await Store.set('aikido_streak',{best:bestStreak}); }
function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){
  const t=dayKey(new Date());
  if(dayLast===t) return;                       // heute schon gezählt
  const y=new Date(); y.setDate(y.getDate()-1);
  dayStreak = (dayLast===dayKey(y)) ? dayStreak+1 : 1;   // Folgetag → +1, sonst neu
  dayLast=t;
  Store.set('aikido_days',{streak:dayStreak,last:dayLast});
  updateStats();
}

/* ---------- Aussprache (japanische Schrift bevorzugt, Stimme wählbar) ---------- */
let allVoices=[], chosenVoiceURI=null;
function loadVoices(){ try{ allVoices=speechSynthesis.getVoices()||[]; }catch(e){ allVoices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function jaVoices(){ return allVoices.filter(v=>(v.lang||'').toLowerCase().startsWith('ja')); }
function pickVoice(){
  if(chosenVoiceURI){ const c=allVoices.find(v=>v.voiceURI===chosenVoiceURI); if(c) return c; }
  const js=jaVoices(); if(!js.length) return null;
  const better=js.find(v=>/enhanced|erweitert|premium|拡張|neural|siri|高品質/i.test(v.name||''));
  return better||js[0];
}
async function loadChosenVoice(){ try{ const s=await Store.get('aikido_voice'); if(s&&s.uri) chosenVoiceURI=s.uri; }catch(e){} }
let _audio=null, _urls={};
function audioURL(jp){
  if(_urls[jp]!==undefined) return _urls[jp];
  const b64=(window.AUDIO||{})[jp];
  if(!b64){ _urls[jp]=null; return null; }
  try{
    const raw=atob(b64.split(',')[1]);
    const arr=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
    _urls[jp]=URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}));
  }catch(e){ _urls[jp]=null; }
  return _urls[jp];
}
function speakCard(card){
  const url=audioURL(card.jp);
  if(url){
    try{
      if(!_audio) _audio=new Audio();
      _audio.onended=null;
      _audio.src=url;
      const p=_audio.play();
      if(p&&p.catch) p.catch(()=>speak(card.ja||card.jp));
      return;
    }catch(e){}
  }
  speak(card.ja || card.jp);
}
function speakSeq(jps){
  // mehrere eingebettete Aufnahmen nacheinander – gleiche Stimme wie überall sonst
  if(!_audio) _audio=new Audio();
  const a=_audio; a.onended=null;
  let i=0;
  const step=()=>{
    if(i>=jps.length){ a.onended=null; return; }
    const jp=jps[i++];
    const url=audioURL(jp);
    if(url){
      a.onended=step;
      a.src=url;
      const p=a.play();
      if(p&&p.catch) p.catch(()=>{ a.onended=null; const c=VOCAB.find(v=>v.jp===jp); speak(c?(c.ja||c.jp):jp); });
    } else {
      a.onended=null;
      const c=VOCAB.find(v=>v.jp===jp); speak(c?(c.ja||c.jp):jp);
      step();
    }
  };
  step();
}
function speakName(t){
  // Technik+Richtung als kombinierten Vokabel-Key (z. B. „Ikkyo Omote"), sonst nur die Technik
  const tech=(t.d && t.d!=='—') ? t.t+' '+t.d : t.t;
  speakSeq([t.a, tech]);
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/\s+/g,'').replace(/\(.+?\)/g,''));
    u.rate=0.78; u.pitch=1;
    const v=pickVoice();
    if(v){ u.voice=v; u.lang=v.lang||'ja-JP'; } else { u.lang='ja-JP'; }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- LERNEN ---------- */
const ROUND=10;  // Runden-Häppchen: so viele Karten/Fragen pro Durchgang
let learnQueue=[], learnIdx=0, isFlipped=false, learnGot=0;
function buildQueue(){
  // schwächste Karten zuerst (niedrigste Leitner-Box), dann auf ein Häppchen begrenzen
  learnQueue=[...filtered()].sort((a,b)=>{ const pa=pget(a.jp),pb=pget(b.jp); if(pa.box!==pb.box) return pa.box-pb.box; return Math.random()-.5; }).slice(0,ROUND);
  learnIdx=0; isFlipped=false; learnGot=0;
}
function renderLearnSummary(){
  const n=learnQueue.length, f=filtered();
  const mastered=f.filter(v=>pget(v.jp).box>=5).length;
  view.innerHTML=`<div class="summary fade">
    <div class="sum-num">${learnGot}/${n}</div>
    <div class="sum-lbl">in dieser Runde gewusst</div>
    <div class="sum-sub">${mastered} von ${f.length} Karten gemeistert</div>
    <button class="sum-go" id="learn-next">Neue Runde</button>
  </div>`;
  bindChips();
  document.getElementById('learn-next').onclick=()=>{ buildQueue(); renderLearn(); };
}
function renderLearn(){
  if(!learnQueue.length) buildQueue();
  if(learnIdx>=learnQueue.length){ renderLearnSummary(); return; }
  const card=learnQueue[learnIdx];
  if(!card){ view.innerHTML='<div class="empty">Keine Karten in dieser Kategorie.</div>'; bindChips(); return; }
  const p=pget(card.jp);
  const dots=[1,2,3,4,5].map(i=>'<span class="'+(i<=p.box?'on':'')+'"></span>').join('');
  view.innerHTML=`
    <div class="progress-line"><i style="width:${Math.round((learnIdx/learnQueue.length)*100)}%"></i></div>
    <div class="deck fade">
      <div class="flip${isFlipped?' flipped':''}" id="flip">
        <div class="face front">
          <div class="cat-seal">${CATS[card.c]}</div>
          <div class="kanji">${card.ja}</div>
          <div class="jp">${card.jp}</div>
          <div class="pron">${card.pr}</div>
          <button class="speak" id="spk1">▶︎ hören</button>
          <div class="tap-hint">tippen zum Umdrehen</div>
        </div>
        <div class="face back">
          <div class="cat-seal">${CATS[card.c]}</div>
          <div class="svgwrap">${iconForCard(card)}</div>
          <div class="de">${card.de}</div>
          <div class="kanji-sm">${card.ja}</div>
          ${card.lit?`<div class="lit">${card.lit}</div>`:''}
          <button class="speak" id="spk2">▶︎ hören</button>
          <div class="boxdots">${dots}</div>
        </div>
      </div>
    </div>
    <div class="grade">
      <button class="again" id="g-again">Nochmal</button>
      <button class="got" id="g-got">Gewusst ✓</button>
    </div>
    <div class="note">${learnIdx+1} / ${learnQueue.length} · die Punkte = deine Leitner-Stufe (5 = gemeistert)</div>`;
  bindChips();
  const flip=document.getElementById('flip');
  flip.onclick=(e)=>{ if(e.target.closest('.speak'))return; isFlipped=!isFlipped; flip.classList.toggle('flipped'); };
  document.getElementById('spk1').onclick=(e)=>{e.stopPropagation();speakCard(card);};
  document.getElementById('spk2').onclick=(e)=>{e.stopPropagation();speakCard(card);};
  document.getElementById('g-again').onclick=()=>grade(card,false);
  document.getElementById('g-got').onclick=()=>grade(card,true);
}
async function grade(card,ok){
  const p=pget(card.jp); p.seen++; touchDay();
  if(ok){ p.box=Math.min(5,p.box+1); p.correct++; learnGot++; } else { p.box=1; }
  await saveProgress(); learnIdx++; isFlipped=false; updateStats();
  if(learnIdx>=learnQueue.length){ renderLearnSummary(); return; }
  renderLearn();
}

/* ---------- QUIZ (mit Verlauf + Vertiefen) ---------- */
let quizHist=[], qIdx=-1;
function rnd(){return Math.random()-.5;}
function makeQuestion(){
  const pool=filtered();
  const card=pool[Math.floor(Math.random()*pool.length)];
  const dir=Math.random()<.5?'jp2de':'de2jp';
  const correct = dir==='jp2de'? card.de : card.jp;
  const distract=[...pool].filter(v=>v.jp!==card.jp).sort(rnd).slice(0,3).map(v=> dir==='jp2de'? v.de : v.jp);
  const opts=[correct,...distract].sort(rnd);
  quizHist.push({card,dir,correct,opts,chosen:null,open:false});
  qIdx=quizHist.length-1; showQuestion();
  if(dir==='jp2de') speakCard(card);   // japanisch gezeigt → vorlesen; de2jp würde die Lösung verraten
}
function startQuiz(){
  if(filtered().length<4){ view.innerHTML='<div class="empty">Mind. 4 Karten nötig – wähle „Alle“ oder eine größere Kategorie.</div>'; bindChips(); return; }
  quizHist=[]; qIdx=-1; makeQuestion();
}
function showQuestion(){
  const q=quizHist[qIdx], card=q.card, answered=q.chosen!==null;
  const head = q.dir==='jp2de'
    ? `<div class="qprompt-label">Was bedeutet …</div><div class="qkanji">${card.ja}</div><div class="qprompt">${card.jp}</div><div class="qpron">${card.pr}</div>`
    : `<div class="qprompt-label">Wie heißt auf Japanisch …</div><div class="qprompt small">${card.de}</div>`;
  let optsHTML=q.opts.map(o=>{
    let cls='opt';
    if(answered){ if(o===q.correct)cls+=' correct'; else if(o===q.chosen)cls+=' wrong'; else cls+=' dim'; }
    return `<button class="${cls}" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`;
  }).join('');
  let after='';
  if(answered){
    const ok=q.chosen===q.correct;
    const last=qIdx===quizHist.length-1 && quizHist.length>=ROUND;
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent('Aikido '+card.jp+' Heuscher');
    after=`<div class="qfb">${ok?'✓ Richtig':'✗ '+card.jp+' = '+card.de}</div>
      <button class="deepen-btn" id="deepen">Mehr dazu ▾</button>
      <div class="deepen" id="deepbox" style="display:${q.open?'block':'none'}">
        <div>${card.ja} · <i>${card.pr}</i></div>
        ${card.lit?`<div style="margin-top:4px">${card.lit}</div>`:''}
        <a href="${yt}" target="_blank" rel="noopener">Auf YouTube ansehen ↗</a>
      </div>
      <div class="qnav">
        ${qIdx>0?'<button class="back" id="qback">← zurück</button>':''}
        <button class="fwd" id="qfwd">${last?'Ergebnis →':'Weiter →'}</button>
      </div>`;
  } else {
    after = qIdx>0 ? `<div class="qnav"><button class="back" id="qback">← zurück</button></div>` : '';
  }
  view.innerHTML=`<div class="qcard fade">${head}<div class="opts">${optsHTML}</div>${after}</div>
    <div class="note">Frage ${qIdx+1} / ${ROUND} · Serie ${bestStreak}</div>`;
  bindChips();
  if(!answered){ view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQuiz(q,b.dataset.o)); }
  const db=document.getElementById('deepen'); if(db) db.onclick=()=>{ q.open=!q.open; document.getElementById('deepbox').style.display=q.open?'block':'none'; };
  const bk=document.getElementById('qback'); if(bk) bk.onclick=()=>{ qIdx--; showQuestion(); };
  const fw=document.getElementById('qfwd'); if(fw) fw.onclick=()=>{
    if(qIdx<quizHist.length-1){ qIdx++; showQuestion(); }
    else if(quizHist.length>=ROUND){ showQuizSummary(); }
    else makeQuestion();
  };
}
function showQuizSummary(){
  const n=quizHist.length;
  const right=quizHist.filter(q=>q.chosen===q.correct).length;
  view.innerHTML=`<div class="summary fade">
    <div class="sum-num">${right}/${n}</div>
    <div class="sum-lbl">richtig in dieser Runde</div>
    <div class="sum-sub">längste Serie: ${bestStreak}</div>
    <button class="sum-go" id="quiz-next">Neue Runde</button>
  </div>`;
  bindChips();
  document.getElementById('quiz-next').onclick=()=>startQuiz();
}
async function answerQuiz(q,chosen){
  if(q.chosen!==null) return;
  q.chosen=chosen;
  const p=pget(q.card.jp); p.seen++; touchDay();
  if(chosen===q.correct){ p.box=Math.min(5,p.box+1); p.correct++; curStreak++; if(curStreak>bestStreak)bestStreak=curStreak; speakCard(q.card); }
  else { p.box=1; curStreak=0; }
  await saveProgress(); updateStats(); showQuestion();
}

/* ---------- NAMEN BAUEN ---------- */
const EXAM=[
  {a:"Shomenuchi Kiawase",t:"Iriminage",d:"—",de:"Eintritts-Wurf aus Schlag gegen die Mitte"},
  {a:"Shomenuchi Kiawase",t:"Kotegaeshi",d:"—",de:"Handgelenk-Umkehr aus Schlag gegen die Mitte"},
  {a:"Katatetori Aihanmi",t:"Ikkyo",d:"Omote",de:"Erste Kontrolle, vorne – aus gleichseitigem Handgelenkgriff"},
  {a:"Katatetori Aihanmi",t:"Ikkyo",d:"Ura",de:"Erste Kontrolle, herum – aus gleichseitigem Handgelenkgriff"},
  {a:"Katatetori Gyakuhanmi",t:"Shihonage",d:"Omote",de:"Vier-Richtungs-Wurf, vorne – aus gespiegeltem Griff"},
  {a:"Katatetori Gyakuhanmi",t:"Shihonage",d:"Ura",de:"Vier-Richtungs-Wurf, herum – aus gespiegeltem Griff"},
  {a:"Ryotetori",t:"Tenchinage",d:"—",de:"Himmel-Erde-Wurf aus beidseitigem Griff"},
  {a:"Ryotetori",t:"Genkeikokyunage",d:"—",de:"Atem-Wurf aus beidseitigem Griff"}
];
const A_OPTS=["Shomenuchi Kiawase","Katatetori Aihanmi","Katatetori Gyakuhanmi","Ryotetori"];
const T_OPTS=["Iriminage","Kotegaeshi","Ikkyo","Shihonage","Tenchinage","Genkeikokyunage"];
const D_OPTS=["—","Omote","Ura"];
let nbTarget=null, nbSel={a:null,t:null,d:null}, nbDone=false;
function newBuild(){ nbTarget=EXAM[Math.floor(Math.random()*EXAM.length)]; nbSel={a:null,t:null,d:null}; nbDone=false; renderBuild(); }
function renderBuild(){
  const rowHTML=(title,opts,key)=>`<div class="nb-row"><h4>${title}</h4><div class="nb-opts">${
    opts.map(o=>`<button class="nb-pick${nbSel[key]===o?' sel':''}" data-k="${key}" data-v="${o}">${o}</button>`).join('')}</div></div>`;
  view.innerHTML=`
    <div class="nb-target fade"><div class="lbl">Bau den Namen</div><div class="desc">${nbTarget.de}</div></div>
    ${rowHTML('1 · Angriffsform',A_OPTS,'a')}
    ${rowHTML('2 · Technik',T_OPTS,'t')}
    ${rowHTML('3 · Richtung',D_OPTS,'d')}
    <button class="nb-check" id="nb-check">Prüfen ⛩</button>
    <div class="nb-feedback" id="nb-fb"></div>
    <div class="note">Angriff + Technik + Richtung – das Namens-System.</div>`;
  view.querySelectorAll('.nb-pick').forEach(b=>b.onclick=()=>{ if(nbDone)return; nbSel[b.dataset.k]=b.dataset.v; renderBuild(); });
  document.getElementById('nb-check').onclick=checkBuild;
}
function checkBuild(){
  if(nbDone){ newBuild(); return; }
  if(!nbSel.a||!nbSel.t||!nbSel.d){ document.getElementById('nb-fb').textContent='Wähle aus allen drei Reihen.'; return; }
  nbDone=true; touchDay();
  view.querySelectorAll('.nb-pick').forEach(b=>{ const k=b.dataset.k,v=b.dataset.v; if(v===nbTarget[k])b.classList.add('ok'); else if(nbSel[k]===v)b.classList.add('bad'); b.onclick=null; });
  const all=nbSel.a===nbTarget.a&&nbSel.t===nbTarget.t&&nbSel.d===nbTarget.d;
  const full=nbTarget.a+' '+nbTarget.t+(nbTarget.d!=='—'?' '+nbTarget.d:'');
  document.getElementById('nb-fb').innerHTML=(all?'✓ Perfekt!':'Fast – richtig ist:')+'<br>'+full;
  if(all)speakName(nbTarget);
  const btn=document.getElementById('nb-check'); btn.textContent='Nächster →'; btn.style.background=all?'var(--ok)':'var(--ai-deep)';
}

/* ---------- LISTE ---------- */
function renderBrowse(){
  let h='';
  const cats = activeCat==='all'? Object.keys(CATS) : [activeCat];
  for(const k of cats){
    const items=VOCAB.filter(v=>v.c===k); if(!items.length)continue;
    h+='<div class="grouphead">'+CATS[k]+'</div>';
    for(const v of items){
      const p=pget(v.jp);
      const dots=[1,2,3,4,5].map(i=>'<span class="'+(i<=p.box?'on':'')+'"></span>').join('');
      h+=`<div class="row"><button class="rspeak" data-jp="${v.jp}">▶︎</button>
        <div class="rmid"><div class="rjp">${v.jp}<small>${v.ja}</small></div><div class="rde">${v.de} · <i>${v.pr}</i></div><div class="mdots">${dots}</div></div></div>`;
    }
  }
  h+='<button class="reset" id="reset">Fortschritt zurücksetzen</button>';
  view.innerHTML=h; bindChips();
  view.querySelectorAll('.rspeak').forEach(b=>b.onclick=()=>{ const c=VOCAB.find(v=>v.jp===b.dataset.jp); if(c)speakCard(c); });
  document.getElementById('reset').onclick=async()=>{ if(confirm('Allen Lernfortschritt zurücksetzen?')){ progress={}; bestStreak=0; curStreak=0; dayStreak=0; dayLast=''; await saveProgress(); await Store.set('aikido_days',{streak:0,last:''}); render(); updateStats(); } };
}

/* ---------- Router ---------- */
function render(){
  view.scrollTop=0;
  if(mode==='learn'){ buildQueue(); renderLearn(); }
  else if(mode==='quiz') startQuiz();
  else if(mode==='build') newBuild();
  else renderBrowse();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); mode=b.dataset.mode; render();
});
const _mb=document.getElementById('menubtn'); if(_mb) _mb.onclick=()=>document.querySelector('.app').classList.toggle('menuopen');
(async function init(){
  await loadChosenVoice();
  const sp=await Store.get('aikido_progress'); if(sp) progress=sp;
  const ss=await Store.get('aikido_streak'); if(ss&&ss.best) bestStreak=ss.best;
  const sd=await Store.get('aikido_days'); if(sd){ dayStreak=sd.streak||0; dayLast=sd.last||''; }
  renderChips(); updateStats(); render();
})();
</script>
